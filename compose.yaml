services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      DATABASE_PATH: /app/data/ikp.sqlite3
      DADATA_API_KEY: ${DADATA_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ikp_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ikp_data:
